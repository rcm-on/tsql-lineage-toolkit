name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (non-LiveSql)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build src/TSqlParser/TSqlParser.csproj -c Release

      - name: Test (Category!=LiveSql)
        run: dotnet test tests/TSqlParser.Tests/TSqlParser.Tests.csproj -c Release --filter "Category!=LiveSql"

      - name: Test NetParser (Category!=LiveSql)
        run: dotnet test tests/NetParser.Tests/NetParser.Tests.csproj -c Release --filter "Category!=LiveSql"

  # LiveSql tests (ViewLineageCatalogTests, AuditorChallengeGateTests) compare against a
  # live SQL Server holding WideWorldImporters + AdventureWorks2019, and are excluded
  # from the job above via the Category!=LiveSql filter (see docs/task-gates-dotnet.md,
  # Paso 3).
  #
  # This job used to be a stub: mcr.microsoft.com/mssql/server (the only official SQL
  # Server image runnable on a hosted runner) only supports SQL auth, while
  # {DbValidator,ObjectExtractor,TableSchemaExtractor} hardcoded "Integrated
  # Security=true" (Windows auth). That blocker is gone — src/TSqlParser/SqlConnections.cs
  # now builds the connection string centrally and switches to SQL auth whenever
  # TSQL_SQL_USER + TSQL_SQL_PASSWORD are both set, falling back to integrated security
  # otherwise (unchanged default). Verified locally 2026-08-16 against
  # mcr.microsoft.com/mssql/server:2022-latest with both databases restored from the
  # public microsoft/sql-server-samples releases (scripts/ci/restore-sample-databases.sh)
  # and a SA password containing ';' and '"' (exercises SqlConnections.Quote) — all 3
  # LiveSql tests passed.
  #
  # Left out of scope by this change: the PIVOT gap in
  # Sales.vSalesPersonSalesByFiscalYears (already documented and excluded via
  # ViewLineageCatalogTests.KnownGaps); the Windows Integrated Security path itself is
  # not exercised by this job, only by developers running locally against SQLEXPRESS.
  #
  # Requires a repo secret TSQL_SQL_SA_PASSWORD: the SA password used to start the
  # mssql service container below (must satisfy SQL Server's password complexity
  # policy — upper+lower+digit+symbol, 8+ chars).
  live-sql-tests:
    name: LiveSql tests (WWI + AdventureWorks2019)
    runs-on: ubuntu-latest
    # Los secrets no llegan a los PR desde un fork: sin TSQL_SQL_SA_PASSWORD el
    # contenedor arranca sin sa y el job solo puede fallar, asi que no se lanza.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.TSQL_SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check the SA password secret is set
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.TSQL_SQL_SA_PASSWORD }}
        run: |
          if [ -z "$MSSQL_SA_PASSWORD" ]; then
            echo "::error::Falta el secret TSQL_SQL_SA_PASSWORD; el contenedor mssql arranca sin sa y los tests LiveSql no pueden conectar."
            exit 1
          fi

      - name: Restore sample databases (WideWorldImporters + AdventureWorks2019)
        run: bash scripts/ci/restore-sample-databases.sh
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.TSQL_SQL_SA_PASSWORD }}

      # El restore habla con el contenedor por `docker exec` (red interna); los tests
      # entran desde el host por localhost:1433. Este sondeo recorre exactamente el
      # camino de los tests, para que un fallo de red/auth se vea aqui y no como un
      # "¿SQL Server no disponible?" del assert.
      - name: Probe SQL Server from the runner host
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.TSQL_SQL_SA_PASSWORD }}
        run: |
          docker run --rm --network host mcr.microsoft.com/mssql/server:2022-latest \
            /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$MSSQL_SA_PASSWORD" -C -b \
            -Q "SELECT name, state_desc FROM sys.databases WHERE database_id > 4;"

      - name: Test (Category=LiveSql)
        run: dotnet test tests/TSqlParser.Tests/TSqlParser.Tests.csproj -c Release --filter "Category=LiveSql"
        env:
          TSQLPARSER_SQL_SERVER: localhost,1433
          TSQL_SQL_USER: sa
          TSQL_SQL_PASSWORD: ${{ secrets.TSQL_SQL_SA_PASSWORD }}

      - name: Dump mssql container logs
        if: failure()
        run: docker logs "$(docker ps -a --filter publish=1433 -q | head -n1)" 2>&1 | tail -n 100
